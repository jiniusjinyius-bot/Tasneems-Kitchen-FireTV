<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a93220"><title>Tasneem's Kitchen</title><style>
:root{--red:#a93220;--saffron:#e9a23b;--cream:#fff8ed;--ink:#39251c;--muted:#80695b}*{box-sizing:border-box}body{margin:0;background:#f8f0e4;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.splash{position:fixed;inset:0;z-index:5;background:#281a16;display:flex;align-items:center;justify-content:center;padding:18px;transition:opacity .3s}.splash img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.83}.splash .start{position:relative;margin-top:auto;margin-bottom:4vh;background:var(--saffron);color:#32180e;border:0;border-radius:999px;padding:14px 26px;font-weight:800;box-shadow:0 5px 20px #0006}.app{max-width:900px;margin:auto;min-height:100vh;background:var(--cream);box-shadow:0 0 30px #583b2010}.top{background:linear-gradient(115deg,#8e261b,#b63b25);color:#fff8e9;padding:18px 18px 22px;border-radius:0 0 24px 24px}.brandrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-family:Georgia,serif;font-size:25px;font-weight:700}.tag{font-size:12px;color:#ffdf9b;margin-top:3px}.round{border:1px solid #ffffff55;background:#ffffff18;color:white;border-radius:50%;width:42px;height:42px;font-size:20px}.searchwrap{position:relative;margin-top:18px}.searchwrap span{position:absolute;left:14px;top:10px;font-size:20px}.search{width:100%;padding:13px 14px 13px 44px;border:0;border-radius:14px;background:#fffaf2;outline:none;color:#39251c}.chips{display:flex;gap:8px;overflow:auto;padding:14px 16px 4px}.chip{white-space:nowrap;border:1px solid #ead7c3;border-radius:99px;background:#fffaf4;color:#6c4735;padding:8px 14px;font-size:13px}.chip.active{background:var(--red);color:white;border-color:var(--red)}main{padding:16px}.sectionline{display:flex;justify-content:space-between;align-items:end;margin:7px 0 15px}.sectionline h2{font:700 24px Georgia,serif;margin:0}.sectionline small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.recipe{background:white;border:1px solid #f0e1cf;border-radius:17px;overflow:hidden;box-shadow:0 5px 16px #6b43200a;position:relative}.recipe img{display:block;width:100%;height:160px;object-fit:cover;background:#ead4b5}.recipe .meta{padding:11px 12px 13px}.recipe h3{font:700 17px Georgia,serif;margin:0 0 5px}.recipe p{font-size:12px;color:var(--muted);margin:0;line-height:1.45}.heart{position:absolute;top:9px;right:9px;background:#fffaf0eF;border:0;border-radius:50%;width:36px;height:36px;color:#9b3828;font-size:20px}.heart.saved{color:#c52539}.detail{display:none}.back{border:0;background:#f5e3cd;border-radius:12px;padding:10px 13px;color:#6a3324;font-weight:700;margin:16px 0}.detailhero{width:100%;max-height:370px;object-fit:contain;background:#f4e4ce;border-radius:18px;border:1px solid #ecd7be}.detailtitle{font:700 32px Georgia,serif;margin:15px 0 5px;color:#7d2b1d}.sub{color:var(--muted);margin:0 0 14px}.facts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.fact{background:#f7e7d2;padding:8px 11px;border-radius:10px;font-size:12px;font-weight:700}.actions{display:flex;gap:9px;margin:14px 0 22px}.action{border:0;border-radius:12px;padding:12px 14px;font-weight:700;flex:1}.share{background:#188b52;color:white}.save{background:#f3dfc4;color:#763426}.detail h3{font:700 22px Georgia,serif;margin:22px 0 10px}.detail ul,.detail ol{padding-left:22px;line-height:1.7}.detail li{margin-bottom:5px}.footer{text-align:center;color:#967a67;font-size:12px;padding:28px 10px}.empty{text-align:center;padding:40px 10px;color:var(--muted);grid-column:1/-1}.hidden{display:none!important}@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.recipe img{height:190px}main{padding:22px}.brand{font-size:29px}}@media(max-width:360px){.recipe img{height:130px}.grid{gap:9px}.recipe h3{font-size:15px}}
</style></head><body>
<div class="splash" id="splash"><img src="assets/cover.jpg" alt="Tasneem's Kitchen recipe book cover"><button class="start" onclick="enterApp()">Open Recipe Book&nbsp; →</button></div>
<div class="app"><header class="top"><div class="brandrow"><div><div class="brand">Tasneem’s Kitchen <span>🍲</span></div><div class="tag">10 authentic recipes · made with love</div></div><button class="round" onclick="showFavorites()" aria-label="Show favourites">♡</button></div><div class="searchwrap"><span>⌕</span><input id="search" class="search" placeholder="Search your favourite recipe…" autocomplete="off"></div></header>
<div class="chips" id="chips"><button class="chip active" data-cat="All">All recipes</button><button class="chip" data-cat="Vegetarian">🥬 Vegetarian</button><button class="chip" data-cat="Non-vegetarian">🍗 Non-veg</button><button class="chip" data-cat="Dessert">🍮 Desserts</button><button class="chip" data-cat="Street food">🌶️ Street food</button><button class="chip" data-cat="Favorites">♥ Favourites</button></div>
<main><section id="home"><div class="sectionline"><h2 id="heading">Recipes for every craving</h2><small id="count">11 recipes</small></div><div class="grid" id="grid"></div></section><section class="detail" id="detail"><button class="back" onclick="goHome()">← All recipes</button><img id="dimg" class="detailhero" alt="Recipe"><h1 class="detailtitle" id="dtitle"></h1><p class="sub" id="dsub"></p><div class="facts" id="facts"></div><div class="actions"><button class="action save" id="dsave" onclick="toggleCurrentFavorite()">♡ Save favourite</button><button class="action share" onclick="shareCurrent()">↗ Share on WhatsApp</button></div><h3>Ingredients</h3><ul id="ingredients"></ul><h3>Method</h3><ol id="method"></ol><p id="tip" class="sub"></p><button class="back" onclick="goHome()">← Back to all recipes</button></section></main><footer class="footer">Made with ❤️ by Tasneem · A little taste of India</footer></div>
<script>
const recipes=[
{id:'biryani',name:'Hyderabadi Dum Biryani',cat:'Non-vegetarian',time:'1 hr 20 min',serves:'4–5',desc:'Fragrant basmati rice layered with spiced chicken.',img:'assets/biryani.jpg',ingredients:['500 g chicken, bone-in pieces','2 cups basmati rice, soaked 30 min','½ cup plain yogurt','2 onions, thinly sliced and fried','2 tomatoes, chopped','2 tbsp ginger-garlic paste','2–3 green chillies','Mint, coriander, biryani masala, turmeric and salt','Whole spices, ghee and saffron milk'],method:['Marinate chicken with yogurt, ginger-garlic, chilli, turmeric, salt, biryani masala and herbs for 30 minutes.','Boil rice with whole spices until about 70% cooked; drain.','Cook the marinated chicken with tomatoes and spices until nearly done.','Layer chicken and rice in a heavy pot. Add fried onions, herbs, saffron milk and ghee.','Cover tightly and cook on low heat for 25–30 minutes. Rest 10 minutes, then fluff gently.'],tip:'Serve hot with raita and lemon wedges.'},
{id:'butter',name:'Butter Chicken',cat:'Non-vegetarian',time:'40 min',serves:'4–5',desc:'Creamy tomato curry with a buttery finish.',img:'assets/butter-chicken.jpg',ingredients:['700 g boneless chicken, bite-size pieces','3 tbsp butter, divided','1 onion, finely diced','3 garlic cloves and 1 tbsp grated ginger','1 cup tomato purée','½ cup cream','¼ cup plain yogurt','Garam masala, cumin, coriander, turmeric and chilli powder','Salt and fresh coriander'],method:['Marinate chicken with yogurt, salt, turmeric and a little garam masala for 15 minutes.','Heat oil and 1 tbsp butter; sauté onion until soft. Add garlic and ginger.','Add tomato purée and spices; simmer until thick.','Cook chicken in the sauce until cooked through, about 10–15 minutes.','Stir in cream and remaining butter. Simmer gently, garnish with coriander.'],tip:'Adjust chilli to taste and serve with naan.'},
{id:'samosa',name:'Crispy Samosa',cat:'Street food',time:'45 min',serves:'6–8 pieces',desc:'Flaky golden pastry with spiced potato filling.',img:'assets/samosa.jpg',ingredients:['1½ cups maida','3 tbsp ghee or oil','½ tsp salt and cold water as needed','3 potatoes, boiled and diced','½ cup green peas','1 tsp cumin seeds','Ginger, green chilli, coriander, garam masala and amchur','Oil for frying'],method:['Rub ghee into flour and salt; add cold water to make a firm dough. Rest 20 minutes.','Sauté cumin, ginger and chilli. Add peas, potatoes and spices; cool completely.','Roll dough into ovals, cut in half and shape into cones. Fill and seal edges with water.','Fry over medium-low heat until crisp and golden. Drain on paper towels.'],tip:'Serve hot with mint-coriander chutney.'},
{id:'dosa',name:'Masala Dosa',cat:'Vegetarian',time:'45 min + fermentation',serves:'4',desc:'Crispy dosa filled with spiced potatoes.',img:'assets/masala-dosa.jpg',ingredients:['1 cup rice, soaked 4–6 hours','¼ cup urad dal, soaked','2 tbsp chana dal and ¼ tsp fenugreek seeds','3 boiled potatoes, mashed','1 onion, sliced','Mustard seeds, curry leaves, turmeric and green chilli','Coconut chutney and sambar to serve'],method:['Blend soaked rice and dals with water to make a smooth batter. Ferment 8–10 hours; add salt.','For filling, temper mustard seeds and curry leaves in oil. Add onion, chilli and turmeric.','Add potatoes and salt; mix and cook for 4–5 minutes.','Spread batter thinly on a hot greased pan. Cook until crisp, add potato filling and fold.'],tip:'Serve immediately with coconut chutney and sambar.'},
{id:'pani',name:'Pani Puri / Golgappa',cat:'Street food',time:'55 min',serves:'20–25 puris',desc:'Crunchy puris with tangy mint water and potato filling.',img:'assets/pani-puri.jpg',ingredients:['20–25 puris','2 potatoes, boiled and diced','½ cup boiled chickpeas','1 cup mint leaves and ½ cup coriander','1–2 green chillies and 1 inch ginger','1 tbsp roasted cumin powder','Chaat masala, black salt and regular salt','4 cups cold water and juice of 1 lemon'],method:['Blend mint, coriander, chilli, ginger, cumin, chaat masala and salts with a little water.','Strain into a jug, add cold water and lemon juice. Chill for 30 minutes.','Mix potato, chickpeas, chopped onion, coriander and chaat masala for filling.','Crack the top of each puri, add filling and pour in chilled pani just before eating.'],tip:'Fill just before serving to keep the puris crunchy.'},
{id:'dal',name:'Dal Tadka',cat:'Vegetarian',time:'30 min',serves:'4',desc:'Comforting yellow lentils finished with a sizzling tadka.',img:null,ingredients:['1 cup toor dal or moong dal, rinsed','½ tsp turmeric and salt to taste','1 onion, finely chopped','2 tomatoes, chopped','1 tsp ginger-garlic paste','1 tsp cumin seeds','2 dried red chillies','A pinch of hing','2 tbsp ghee or oil','Fresh coriander and lemon'],method:['Pressure cook dal with turmeric, salt and 3 cups water until soft. Whisk until creamy.','Heat a little oil; sauté onion, ginger-garlic and tomatoes until soft. Add to dal.','Adjust consistency with water and simmer for 5–7 minutes.','For tadka, heat ghee; add cumin, dried chillies and hing. Pour over dal.','Garnish with coriander and lemon juice.'],tip:'Enjoy with steamed rice, jeera rice or roti.'},
{id:'chole',name:'Chole Bhature',cat:'Street food',time:'45 min',serves:'4',desc:'Spiced chickpea curry with fluffy fried bread.',img:'assets/chole-bhature.jpg',ingredients:['1½ cups dried chickpeas, soaked and boiled','2 tbsp oil or ghee','1 large onion, chopped','2 tomatoes, puréed','1 tbsp ginger-garlic paste','Cumin, coriander, turmeric, chilli and chole masala','2 cups maida, 2 tbsp semolina','2 tbsp yogurt, ½ tsp baking soda, salt and water','Oil for deep frying'],method:['Heat oil and cumin; sauté onion until golden. Add ginger-garlic and green chilli.','Add tomato purée and spices; cook until oil separates. Add chickpeas and water; simmer 10–12 minutes.','For bhature, mix maida, semolina, yogurt, baking soda and salt. Add water and knead a soft dough. Rest 30 minutes.','Roll dough into ovals and deep-fry in hot oil until puffed and golden.'],tip:'Serve hot with sliced onion, pickle and lemon.'},
{id:'palak',name:'Palak Paneer',cat:'Vegetarian',time:'30 min',serves:'4',desc:'Paneer cubes in a smooth, vibrant spinach gravy.',img:'assets/palak-paneer.jpg',ingredients:['250 g fresh spinach, washed','200 g paneer, cubed','1 small onion, chopped','1 tomato, chopped','2 garlic cloves and 1 tsp ginger','1 green chilli, optional','1 tsp cumin seeds','½ tsp turmeric, 1 tsp coriander powder','½ tsp garam masala, salt and 2 tbsp cream'],method:['Blanch spinach for 2 minutes, cool in ice water, drain and blend to a purée.','Heat oil; add cumin, onion, garlic, ginger and green chilli. Cook until soft.','Add tomato and spices; cook until tomato breaks down.','Stir in spinach purée and a little water; simmer for 3–4 minutes.','Add paneer and garam masala; simmer gently. Finish with cream and coriander.'],tip:'Serve with roti, naan or steamed rice.'},
{id:'gulab',name:'Gulab Jamun',cat:'Dessert',time:'40 min',serves:'12–14 pieces',desc:'Soft milk dumplings soaked in rose-cardamom syrup.',img:'assets/gulab-jamun.jpg',ingredients:['1 cup full-fat milk powder','2 tbsp maida','1 tbsp semolina','¼ tsp baking soda','2 tbsp melted ghee','2–3 tbsp milk, as needed','1½ cups sugar and 1¼ cups water','4 cardamom pods, saffron and 1 tsp rose water'],method:['Simmer sugar, water, cardamom and saffron for 6–7 minutes. Stir in rose water and keep warm.','Mix milk powder, flour, semolina and baking soda. Rub in ghee and add milk gradually to form a soft dough.','Shape into smooth crack-free balls. Fry on low heat, turning gently, until evenly golden brown.','Add warm fried jamuns to warm syrup and soak for at least 30 minutes.'],tip:'Keep both the syrup and jamuns warm when combining.'},
{id:'idli',name:'Idli Sambar',cat:'Vegetarian',time:'8 hr 25 min',serves:'12 idlis + sambar',desc:'Soft steamed rice cakes with hearty lentil-vegetable sambar.',img:'assets/idli-sambar.jpg',ingredients:['1 cup urad dal, soaked 4–6 hours','2 cups idli rice, soaked 4–6 hours','½ tsp fenugreek seeds and salt','½ cup toor dal','1 cup mixed vegetables','2 tsp sambar powder','Tamarind water, turmeric and salt','Mustard seeds, curry leaves and dried chilli'],method:['Grind soaked urad dal and fenugreek smooth. Grind rice slightly coarse; mix with salt and ferment 8–10 hours.','Grease idli moulds, pour in batter and steam 10–12 minutes. Rest 5 minutes before unmoulding.','Pressure cook toor dal until soft. Simmer vegetables with water until tender.','Add sambar powder, tamarind, turmeric, salt and cooked dal; simmer 8–10 minutes.','Temper mustard seeds, dried chilli and curry leaves in oil and add to sambar.'],tip:'Serve hot with coconut chutney.'},
{id:'aloo',name:'Aloo Gobi',cat:'Vegetarian',time:'35 min',serves:'4',desc:'North Indian potato and cauliflower curry with warm spices.',img:'assets/aloo-gobi.jpg',ingredients:['1 medium cauliflower, cut into florets','2 medium potatoes, peeled and cubed','2 tbsp oil','1 tsp cumin seeds','1 small onion, chopped','2 tsp ginger-garlic paste','1 tsp turmeric','1½ tsp coriander powder','1 tsp garam masala and chilli to taste','Salt, fresh coriander and 2 tbsp water'],method:['Heat oil in a pan. Add cumin seeds and let sizzle for 20–30 seconds.','Add onion and sauté until soft. Add ginger-garlic and cook for 1 minute.','Add turmeric, coriander and chilli powder, then potatoes; cook for 4–5 minutes.','Add cauliflower, salt and water. Cover and cook on low heat 12–15 minutes until tender.','Sprinkle garam masala, cook uncovered for 1–2 minutes and garnish with coriander.'],tip:'Serve with roti, naan or steamed basmati rice.'}
];
let category='All',current=null,favs=JSON.parse(localStorage.getItem('tk-favs')||'[]');const $=id=>document.getElementById(id);function enterApp(){$('splash').style.opacity='0';setTimeout(()=>$('splash').classList.add('hidden'),300)}function isFav(id){return favs.includes(id)}function toggleFav(id){favs=isFav(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem('tk-favs',JSON.stringify(favs));render();if(current)updateSaveButton()}function toggleCurrentFavorite(){if(current)toggleFav(current.id)}function showFavorites(){category='Favorites';setChips();goHome();render()}function setChips(){document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.cat===category))}document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.cat;setChips();render()}));$('search').addEventListener('input',render);function render(){let q=$('search').value.toLowerCase().trim();let items=recipes.filter(r=>(category==='All'||(category==='Favorites'?isFav(r.id):r.cat===category))&&(`${r.name} ${r.desc} ${r.cat}`.toLowerCase().includes(q)));$('heading').textContent=category==='Favorites'?'Your favourite recipes':category==='All'?'Recipes for every craving':category;$('count').textContent=`${items.length} recipe${items.length===1?'':'s'}`;$('grid').innerHTML=items.length?items.map(r=>`<article class="recipe" onclick="openRecipe('${r.id}')"><button class="heart ${isFav(r.id)?'saved':''}" onclick="event.stopPropagation();toggleFav('${r.id}')" aria-label="${isFav(r.id)?'Remove favourite':'Save favourite'}">${isFav(r.id)?'♥':'♡'}</button>${r.img?`<img src="${r.img}" alt="${r.name}" loading="lazy">`:`<div style="height:160px;display:grid;place-items:center;background:linear-gradient(135deg,#f3d49b,#a9b77b);font-size:60px">🍛</div>`}<div class="meta"><h3>${r.name}</h3><p>${r.desc}</p><p style="margin-top:8px;color:#a34a2c;font-weight:700">◷ ${r.time}</p></div></article>`).join(''):'<div class="empty">No recipes found. Try another search ❤️</div>'}function openRecipe(id){current=recipes.find(r=>r.id===id);if(!current)return;$('home').classList.add('hidden');$('detail').style.display='block';$('dimg').src=current.img||'assets/cover.jpg';$('dimg').alt=current.name;$('dtitle').textContent=current.name;$('dsub').textContent=current.desc;$('facts').innerHTML=`<span class="fact">◷ ${current.time}</span><span class="fact">🍽 Serves ${current.serves}</span><span class="fact">${current.cat==='Vegetarian'?'🥬 Vegetarian':current.cat==='Non-vegetarian'?'🍗 Non-veg':current.cat==='Dessert'?'🍮 Dessert':'🌶️ Street food'}</span>`;$('ingredients').innerHTML=current.ingredients.map(x=>`<li>${x}</li>`).join('');$('method').innerHTML=current.method.map(x=>`<li>${x}</li>`).join('');$('tip').textContent='✨ Tasneem’s tip: '+current.tip;updateSaveButton();window.scrollTo({top:0,behavior:'smooth'})}function updateSaveButton(){$('dsave').textContent=isFav(current.id)?'♥ Saved to favourites':'♡ Save favourite'}function goHome(){$('detail').style.display='none';$('home').classList.remove('hidden');current=null;render();window.scrollTo({top:0,behavior:'smooth'})}function shareCurrent(){if(!current)return;const text=`${current.name}\n${current.desc}\n\nIngredients:\n${current.ingredients.map(x=>'• '+x).join('\n')}\n\nMethod:\n${current.method.map((x,i)=>(i+1)+'. '+x).join('\n')}\n\nShared from Tasneem’s Kitchen`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener,noreferrer')}render();
</script></body></html>
